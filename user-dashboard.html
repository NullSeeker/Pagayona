<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DogCare - My Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    body {
      font-family: 'Nunito', Arial, sans-serif;
      background-color: #f7f0e3;
      color: #1d2b23;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
 
    main {
      flex: 1;
    }
 
    h1, h2 {
      font-family: 'Fraunces', Georgia, serif;
      color: #1f3d2f;
    }
 
    header {
      background-color: #1f3d2f;
      padding: 16px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
 
    header h1, header h2 {
      color: #f7f0e3;
      font-size: 26px;
    }
 
    nav a {
      color: #f7f0e3;
      text-decoration: none;
      font-weight: bold;
      margin-left: 12px;
      padding: 8px 16px;
      border-radius: 20px;
      transition: background-color 0.3s;
    }
 
    nav a:hover {
      background-color: #2f5a45;
    }
 
    nav a.cta {
      background-color: #c2561f;
    }
 
    nav a.cta:hover {
      background-color: #a84614;
    }
 
    .btn {
      display: inline-block;
      background-color: #c2561f;
      color: white;
      padding: 14px 28px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.3s, background-color 0.3s;
    }
 
    .btn:hover {
      background-color: #a84614;
      transform: scale(1.05);
    }
 
    form .btn {
      width: 100%;
      margin-top: 16px;
    }
 
    .form-group {
      margin-bottom: 16px;
    }
 
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #1f3d2f;
    }
 
    input, textarea {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      background-color: #eadfc8;
      font-size: 16px;
      font-family: inherit;
    }
 
    input:focus, textarea:focus {
      outline: 3px solid #c2561f;
      background-color: white;
    }
 
    .row {
      display: flex;
      gap: 16px;
    }
 
    .row .form-group {
      flex: 1;
    }
 
    .wrap {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      width: 100%;
    }
 
    .dash {
      display: flex;
      gap: 32px;
      align-items: flex-start;
    }
 
    .dash aside {
      flex: 1;
    }
 
    .dash .panel {
      flex: 2;
    }
 
    .card, .panel {
      background-color: white;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 4px 15px rgba(31, 61, 47, 0.15);
      margin-bottom: 24px;
    }
 
    .card h2, .panel h2 {
      font-size: 24px;
      margin-bottom: 16px;
    }
 
    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background-color: #f2c46d;
      color: #1f3d2f;
      font-family: 'Fraunces', Georgia, serif;
      font-size: 30px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 16px;
    }
 
    .info-group {
      margin-bottom: 10px;
    }
 
    .empty {
      background-color: #eadfc8;
      padding: 16px;
      border-radius: 16px;
      color: #5f6b60;
      font-style: italic;
    }
 
    footer {
      background-color: #1f3d2f;
      color: #f7f0e3;
      text-align: center;
      padding: 20px;
    }
 
    @media (max-width: 800px) {
      header {
        flex-direction: column;
        gap: 10px;
        padding: 16px;
      }
 
      .dash {
        flex-direction: column;
      }
 
      .row {
        flex-direction: column;
        gap: 0;
      }
 
    }
    
  </style>
</head>
<body>

  <header>
    <h1>DOGCARE</h1>
    <nav>
      <a href="homepage.html">Services</a>
      <a href="user-dashboard.html">My Profile</a>
      <a href="landingofnew.html">Logout</a>
    </nav>
  </header>

  <main class="wrap dash">
    
    <aside>
      <section class="card">
        <div class="avatar">L</div>
        <h2>My Information</h2>
        <div class="info-group"><p><strong>Name:</strong> Loraine Pagayona</p></div>
        <div class="info-group"><p><strong>Email:</strong> loraine@example.com</p></div>
        <div class="info-group"><p><strong>Mobile:</strong> 123-456-7890</p></div>
      </section>
      
      <section class="card">
        <h2>My Dogs</h2>
        <p>No dogs registered yet.</p>
      </section>
    </aside>

    
    <section class="panel">
      <h2>Register a New Dog</h2>
      
      <form action="user-dashboard.html" method="GET">
        <label for="dog-name">Dog Name</label>
        <input type="text" id="dog-name" required>
        
        <label for="dog-breed">Breed</label>
        <input type="text" id="dog-breed" required>
        
        <label for="dog-birthdate">Birthdate</label>
        <input type="date" id="dog-birthdate" required>
        
        <label for="dog-complications">Medical Complications</label>
        <textarea id="dog-complications" rows="3" placeholder="List any allergies, injuries, or conditions..."></textarea>
        
        <button type="submit" class="btn">Register Dog</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 DogCare. All rights reserved.</p>
  </footer>

</body>
</html>
