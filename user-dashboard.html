<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DogCare - My Profile</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background-color: #f4f8f9; 
      display: flex; 
      flex-direction: column; 
      min-height: 100vh; 
    }
    
    header { 
      background-color: #005b68; 
      color: white; 
      padding: 1rem 2rem; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    
    header h1 { 
      font-size: 1.8rem; 
    }
    
    nav a { 
      color: white; 
      text-decoration: none; 
      margin-left: 1.5rem; 
      font-weight: bold; 
    }
    
    nav a:hover { 
      text-decoration: underline; 
    }
    
    main { 
      flex: 1; 
      max-width: 1000px; 
      margin: 2rem auto; 
      padding: 0 1rem; 
      display: grid; 
      grid-template-columns: 1fr 2fr; 
      gap: 2rem; 
      width: 100%; 
    }
    
    .card { 
      background: white; 
      padding: 1.5rem; 
      border-radius: 8px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.08); 
      margin-bottom: 1.5rem; 
    }
    
    .card h2 { 
      color: #005b68; 
      border-bottom: 2px solid #e0f2f5; 
      padding-bottom: 0.5rem; 
      margin-bottom: 1rem; 
    }
    
    .info-group { 
      margin-bottom: 0.8rem; 
    }
    
    .info-group strong { 
      color: #333; 
    }
    
    label { 
      display: block; 
      margin-top: 1rem; 
      margin-bottom: 0.3rem; 
      font-weight: bold; 
      color: #333; 
    }
    
    input, textarea { 
      width: 100%; 
      padding: 0.75rem; 
      border: 1px solid #ccc; 
      border-radius: 4px; 
      font-size: 1rem; 
    }
    
    .btn { 
      background-color: #0096ab; 
      color: white; 
      padding: 0.9rem; 
      border: none; 
      border-radius: 4px; 
      margin-top: 1.5rem; 
      cursor: pointer; 
      font-weight: bold; 
      width: 100%; 
      font-size: 1.1rem; 
    }
    
    .btn:hover { 
      background-color: #007888; 
    }
    
    footer { 
      background-color: #003e47; 
      color: white; 
      text-align: center; 
      padding: 1rem; 
    }

    
    
  </style>
</head>
<body>

  <header>
    <h1>DOGCARE</h1>
    <nav>
      <a href="homepage.html">Services</a>
      <a href="user-dashboard.html">My Profile</a>
      <a href="landingofnew.html">Logout</a>
    </nav>
  </header>

  <main>
    
    <aside>
      <section class="card">
        <h2>My Information</h2>
        <div class="info-group"><p><strong>Name:</strong> Loraine Pagayona</p></div>
        <div class="info-group"><p><strong>Email:</strong> loraine@example.com</p></div>
        <div class="info-group"><p><strong>Mobile:</strong> 123-456-7890</p></div>
      </section>
      
      <section class="card">
        <h2>My Dogs</h2>
        <p style="color: #666; font-style: italic;">No dogs registered yet.</p>
      </section>
    </aside>

    
    <section class="card">
      <h2>Register a New Dog</h2>
      
      <form action="user-dashboard.html" method="GET">
        <label for="dog-name">Dog Name</label>
        <input type="text" id="dog-name" required>
        
        <label for="dog-breed">Breed</label>
        <input type="text" id="dog-breed" required>
        
        <label for="dog-birthdate">Birthdate</label>
        <input type="date" id="dog-birthdate" required>
        
        <label for="dog-complications">Medical Complications</label>
        <textarea id="dog-complications" rows="3" placeholder="List any allergies, injuries, or conditions..."></textarea>
        
        <button type="submit" class="btn">Register Dog</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 DogCare. All rights reserved.</p>
  </footer>

</body>
</html>
