<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DogCare - Admin Login</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background-color: #eceff1; 
      color: #333; 
      display: flex; 
      flex-direction: column; 
      min-height: 100vh; 
    }

    header { 
      background-color: #263238; 
      color: white; 
      padding: 1rem 2rem; 
      text-align: center; 
    }

    main { 
      flex: 1; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 2rem 1rem; 
    }

    .login-card { 
      background: white; 
      padding: 2.5rem 2rem; 
      border-radius: 8px; 
      width: 100%; 
      max-width: 400px; 
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); 
      border-top: 5px solid #ff9800;
    }

    .login-card h2 { 
      color: #263238; 
      margin-bottom: 0.5rem; 
      text-align: center; 
    }
    
    .login-card p {
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .form-group { 
      margin-bottom: 1.2rem; 
    }

    .form-group label { 
      display: block; 
      margin-bottom: 0.4rem; 
      font-weight: bold; 
      color: #263238;
    }

    .form-group input { 
      width: 100%; 
      padding: 0.75rem; 
      border: 1px solid #ccc; 
      border-radius: 4px; 
      font-size: 1rem; 
    }

    .btn-submit { 
      width: 100%; 
      background-color: #263238; 
      color: white; 
      padding: 0.85rem; 
      border: none; 
      border-radius: 4px; 
      font-weight: bold; 
      font-size: 1.05rem; 
      cursor: pointer; 
      margin-top: 0.5rem; 
      transition: background-color 0.2s;
    }

    .btn-submit:hover { 
      background-color: #1c262b; 
    }

    .user-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
    }

    .user-link a {
      color: #0096ab;
      text-decoration: none;
      font-weight: bold;
    }

    .user-link a:hover {
      text-decoration: underline;
    }

    footer { 
      background-color: #1c262b; 
      color: white; 
      text-align: center; 
      padding: 1rem; 
    }
  </style>
</head>
<body>

  <header>
    <h2>DOGCARE</h2>
  </header>

  <main>
    <section class="login-card">
      <h2>Admin Login</h2>
      <p>Please enter your administrative credentials.</p>
      
      
      <form action="admin-dashboard.html" method="GET">
        
        <div class="form-group">
          <label for="admin-user">Admin Username / Email</label>
          <input type="text" id="admin-user" required>
        </div>

        <div class="form-group">
          <label for="admin-password">Password</label>
          <input type="password" id="admin-password" required>
        </div>

        <button type="submit" class="btn-submit">Login as Admin</button>
      </form>

      <div class="user-link">
        Not an admin? <a href="login.html">Go to User Login</a>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 DogCare. Admin Access Only.</p>
  </footer>

</body>
</html>
